name: Content Editor packages

on:
  push:
    branches: [main]
    tags: ["content-editor-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build portable packages
        shell: pwsh
        run: ./scripts/pack_content_editor.ps1 -Platform all
      - uses: actions/upload-artifact@v4
        with:
          name: content-editor-packages
          path: |
            dist/win/*.zip
            dist/linux/*.tar.gz
            dist/macos/*.tar.gz
      - name: Define automatic release version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          "RELEASE_TAG=content-editor-v0.1.${{ github.run_number }}" >> $env:GITHUB_ENV
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/content-editor-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win/*.zip
            dist/linux/*.tar.gz
            dist/macos/*.tar.gz
      - name: Publish automatic main release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Content Editor v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/win/*.zip
            dist/linux/*.tar.gz
            dist/macos/*.tar.gz
