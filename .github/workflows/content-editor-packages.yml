name: Content Editor packages

on:
  push:
    tags: ["content-editor-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable packages
        shell: pwsh
        run: ./scripts/pack_content_editor.ps1 -Platform all
      - uses: actions/upload-artifact@v4
        with:
          name: content-editor-packages
          path: |
            dist/win/*.zip
            dist/linux/*.tar.gz
            dist/macos/*.tar.gz
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/content-editor-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win/*.zip
            dist/linux/*.tar.gz
            dist/macos/*.tar.gz
