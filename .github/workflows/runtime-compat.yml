name: Runtime compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-runtime-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: step-security/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: luajit-2.1
      - name: Run runtime compatibility tests
        shell: bash
        run: |
          lua tests/test_state_stack.lua
          lua tests/content-editor/test_manifest_target.lua
          lua tests/content-editor/test_playtest_paths.lua
          lua tests/content-editor/test_mapbuilder_manifest.lua
          lua tests/content-editor/test_tileset_export.lua

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux portable package
        shell: pwsh
        run: ./scripts/pack_content_editor.ps1 -Platform linux
      - name: Verify Linux archive
        shell: bash
        run: |
          archive="$(find dist/linux -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir package
          tar -xzf "$archive" -C package
          launcher="$(find package -name ContentEditor.sh -print -quit)"
          test -x "$launcher"
          if grep -IU $'\r' "$launcher"; then
            echo 'ContentEditor.sh contains CRLF line endings' >&2
            exit 1
          fi
          test -f "$(dirname "$launcher")/src/core/StateStack.lua"
          test -f "$(dirname "$launcher")/tests/love_stub.lua"

  macos-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS portable package
        shell: pwsh
        run: ./scripts/pack_content_editor.ps1 -Platform macos
      - name: Verify macOS archive
        shell: bash
        run: |
          archive="$(find dist/macos -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          mkdir package
          tar -xzf "$archive" -C package
          launcher="$(find package -name ContentEditor.command -print -quit)"
          root="$(dirname "$launcher")"
          test -x "$launcher"
          test -x "$root/love/love.app/Contents/MacOS/love"
          test -f "$root/tests/love_stub.lua"
          if grep -IU $'\r' "$launcher"; then
            echo 'ContentEditor.command contains CRLF line endings' >&2
            exit 1
          fi
